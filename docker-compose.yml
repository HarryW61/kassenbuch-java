# Start the web app with the bookkeeping files in a named volume.
#
#   docker compose up -d
#   open http://localhost:8090
#
# Change the port with  KB_PORT=1234 docker compose up
# Point at an existing data directory with  KB_DATA=/pfad/zum/data docker compose up
# Point at an existing output directory with  KB_OUT=/pfad/zum/out docker compose up

services:
  kassenbuch:
    build: .
    image: kassenbuch
    container_name: kassenbuch
    # Start as root so docker/entrypoint.sh can hand the volume roots over to the invoking
    # user on the container's very first start - Docker creates them root-owned. The script
    # drops CAP_CHOWN and re-execs the server as ${UID}:${GID}, so nothing but that one step
    # ever runs privileged. Files written into mounted host directories stay owned by that
    # user, not by root.
    user: root
    ports:
      - "${KB_PORT:-8090}:8090"
    environment:
      KB_DATA: /data
      KB_OUT: /out
      KB_PORT: "8090"
      KB_RUN_UID: "${UID:-1000}"
      KB_RUN_GID: "${GID:-1000}"
    volumes:
      - ${KB_DATA:-kassenbuch-data}:/data
      - ${KB_OUT:-kassenbuch-out}:/out

# Declared so the named defaults above exist; a KB_DATA/KB_OUT path overrides them.
volumes:
  kassenbuch-data:
  kassenbuch-out:
